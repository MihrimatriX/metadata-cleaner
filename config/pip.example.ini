; Örnek pip yapılandırması — kopyalayıp kullanın:
;   %APPDATA%\pip\pip.ini   (Windows)
; veya ortam değişkeni:
;   setx PIP_CONFIG_FILE "C:\path\to\metadata-cleaner\config\pip.local.ini"
;
; Özel indeks (kurumsal ayna vb.) için aşağıdaki satırların yorumunu kaldırın.

[global]
timeout = 120
; index-url = https://pypi.org/simple/
; extra-index-url =
; trusted-host = pypi.org files.pythonhosted.org

[install]
; upgrade = true
